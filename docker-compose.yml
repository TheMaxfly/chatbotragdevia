services:
  rncp-rag:
    build:
      context: .
    image: rncp-rag:local
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: /app/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
