name: Build Docker Image

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build:
    name: Build image when Dockerfile exists
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: dockerfile
        run: |
          if [ -f docker/Dockerfile ]; then
            echo "path=docker/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ -f Dockerfile ]; then
            echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.path != ''
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.dockerfile.outputs.path != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip image build
        if: steps.dockerfile.outputs.path == ''
        run: echo "No Dockerfile found; image build skipped."
